<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PolyScope Paper</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; background: #0c1117; color: #e8edf2; }
    body { margin: 0; padding: 1rem; max-width: 32rem; margin-inline: auto; }
    .badge { display: inline-block; background: #1a4d3a; color: #b8f0d8; padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .locked { background: #3a1a1a; color: #f0b8b8; margin-left: 0.5rem; }
    .tag { display: inline-block; background: #243044; color: #c5d4e8; padding: 0.15rem 0.45rem; border-radius: 6px; font-size: 0.7rem; margin: 0.15rem 0.15rem 0 0; }
    .label { display: inline-block; background: #2a3544; color: #b8c5d6; padding: 0.2rem 0.5rem; border-radius: 8px; font-size: 0.72rem; margin: 0.2rem 0.2rem 0 0; }
    .alert-banner { background: #3d2a10; border: 1px solid #a67c2e; color: #ffe6b3; padding: 0.65rem 0.75rem; border-radius: 10px; margin: 0.75rem 0; font-size: 0.88rem; line-height: 1.4; }
    h1 { font-size: 1.25rem; margin: 0.75rem 0 0.25rem; }
    .muted { color: #8b98a8; font-size: 0.85rem; line-height: 1.4; }
    .card { background: #151c24; border: 1px solid #2a3544; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    .call { font-size: 1.1rem; font-weight: 600; margin: 0.5rem 0; }
    .reason { font-size: 0.95rem; line-height: 1.45; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 10px; background: #2d6cdf; color: #fff; font-size: 1rem; font-weight: 600; margin: 0.5rem 0; }
    button:disabled { opacity: 0.5; }
    ul.markets { list-style: none; padding: 0; margin: 0; }
    ul.markets li { padding: 0.5rem 0; border-bottom: 1px solid #2a3544; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 0.4rem 0.2rem; border-bottom: 1px solid #2a3544; vertical-align: top; }
    .outcome { color: #8b98a8; font-style: italic; }
    .row-alert td:first-child { box-shadow: inset 3px 0 0 #c9a227; }
    .server-id { color: #6b9bd1; font-size: 0.75rem; }
  </style>
</head>
<body>
  <span class="badge">PAPER ONLY</span>
  <span class="badge locked">LIVE LOCKED</span>
  <div id="app">
    <p class="muted" id="bootStatus">Loading from server...</p>
  </div>

  <script>
    const STATE_URL = {{ api_state_path | tojson }};
    const REFRESH_URL = {{ api_refresh_path | tojson }};

    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(d.getUTCDate()).padStart(2, '0');
      const hh = String(d.getUTCHours()).padStart(2, '0');
      const mi = String(d.getUTCMinutes()).padStart(2, '0');
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    function renderTags(tags) {
      return (tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    }

    function renderLabels(labels) {
      return (labels || []).map(l => `<span class="label">${esc(l)}</span>`).join('');
    }

    function renderEvidence(latest) {
      const ev = latest && latest.evidence;
      if (!ev) return '';
      const items = ev.items || [];
      const ids = ev.evidence_ids || [];
      let rows = items.map(e =>
        `<li>${esc(e.title || e.market_slug)} · YES buy ${esc(e.yes_buy_price || 'n/a')} · ${esc(e.id)}</li>`
      ).join('');
      if (!rows && ids.length) {
        rows = ids.map(id => `<li>${esc(id)}</li>`).join('');
      }
      if (!rows) return '';
      const vault = latest.vault_decision_path
        ? `<div class="muted">Vault note: ${esc(latest.vault_decision_path)}</div>` : '';
      return `
        <div class="muted" style="margin-top:0.75rem">Evidence (computed in code)</div>
        <ul class="markets">${rows}</ul>${vault}`;
    }

    function renderState(state) {
      const latest = state.latest;
      const alert = latest && latest.alert;
      const alertHtml = alert
        ? `<div class="alert-banner" role="status"><strong>Paper alert:</strong> Latest call is ${esc(latest.call)} on ${esc(latest.market_title)}. Still no live order.</div>`
        : '';

      let currentHtml;
      if (latest) {
        currentHtml = `
          <div class="call">${esc(latest.call)} · ${esc(latest.market_title)}</div>
          <div class="server-id">Stored row #${esc(latest.id)} from database</div>
          <div style="margin:0.35rem 0">${renderLabels(latest.labels)}</div>
          <div>${renderTags(latest.tags)}</div>
          <div class="reason">${esc(latest.reason)}</div>
          ${renderEvidence(latest)}
          <div class="muted" style="margin-top:0.5rem">${esc(latest.created_at)}</div>
          <div class="muted">Outcome (fill later): <span class="outcome">${esc(latest.outcome || 'pending')}</span></div>`;
      } else {
        currentHtml = '<p class="muted">No paper call yet. Tap the button to run the loop.</p>';
      }

      const markets = (state.markets || []).map(m => `<li>${esc(m.title)}</li>`).join('')
        || '<li class="muted">Markets unavailable right now.</li>';

      const history = (state.decisions || []).map(d => {
        const title = d.market_title || '';
        const short = title.length > 40 ? title.slice(0, 40) + '…' : title;
        const rowClass = d.alert ? 'row-alert' : '';
        return `<tr class="${rowClass}">
          <td>${esc(fmtTime(d.created_at))}<br><span class="server-id">#${esc(d.id)}</span></td>
          <td>${esc(d.call)}<br><span class="muted">${esc(short)}</span></td>
          <td>${renderTags(d.tags)}</td>
          <td class="outcome">${esc(d.outcome || 'pending')}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="4" class="muted">No history yet.</td></tr>';

      document.getElementById('app').innerHTML = `
        <h1>Paper loop</h1>
        <p class="muted">Backend-driven. ${esc(state.loop_pass_count)} decision(s) in SQLite. Open markets loaded live.</p>
        ${alertHtml}
        <div class="card">
          <div class="muted">Current paper call · provider: ${esc(latest ? latest.provider : 'none')}</div>
          ${currentHtml}
          <button type="button" id="refreshBtn">Run paper loop</button>
          <p id="status" class="muted"></p>
        </div>
        <h2 style="font-size:1rem">Open markets</h2>
        <ul class="markets">${markets}</ul>
        <h2 style="font-size:1rem">Stored decisions</h2>
        <table>
          <thead><tr><th>Time</th><th>Call</th><th>Tags</th><th>Outcome</th></tr></thead>
          <tbody>${history}</tbody>
        </table>`;

      document.getElementById('refreshBtn').addEventListener('click', runLoop);
    }

    async function loadState() {
      const boot = document.getElementById('bootStatus');
      const r = await fetch(STATE_URL, { credentials: 'same-origin' });
      if (!r.ok) throw new Error(await r.text());
      const state = await r.json();
      renderState(state);
      if (boot) boot.remove();
      return state;
    }

    async function runLoop() {
      const btn = document.getElementById('refreshBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.textContent = 'POST refresh: fetching Polymarket, writing vault, storing row...';
      try {
        const r = await fetch(REFRESH_URL, { method: 'POST', credentials: 'same-origin' });
        if (!r.ok) throw new Error(await r.text());
        const stored = await r.json();
        const state = await loadState();
        status.textContent = `Saved server row #${stored.id}. UI updated from GET ${STATE_URL}.`;
        btn.disabled = false;
      } catch (e) {
        status.textContent = 'Request failed. Try again.';
        btn.disabled = false;
      }
    }

    loadState().catch(() => {
      document.getElementById('app').innerHTML = '<p class="muted">Could not load state from server.</p>';
    });
  </script>
</body>
</html>
